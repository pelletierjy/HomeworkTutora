<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Homework Tutora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/en/favicon.ico" />
  </head>
  <body>
    <script>
      (function () {
        var SUPPORTED = ['en', 'fr', 'es'];
        var STORAGE_KEY = 'hw-tutora-locale';
        function pickLocale() {
          try {
            var stored = window.localStorage.getItem(STORAGE_KEY);
            if (stored && SUPPORTED.indexOf(stored) !== -1) return stored;
          } catch (e) {}
          var candidates =
            navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
          for (var i = 0; i < candidates.length; i++) {
            var base = (candidates[i] || '').slice(0, 2).toLowerCase();
            if (SUPPORTED.indexOf(base) !== -1) return base;
          }
          return 'en';
        }
        window.location.replace('/' + pickLocale() + '/');
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/en/" />
    </noscript>
  </body>
</html>
